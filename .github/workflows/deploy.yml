name: CI/CD Pipeline - Office Jukebox

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  # ============================================================================
  # 1. CI (Continuous Integration): Test & Quality Checks
  # ============================================================================
  test:
    name: Run Automated Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Django test suite
        run: |
          python manage.py test

  # ============================================================================
  # 2. CD (Continuous Deployment): Auto-Deploy to AWS EC2 via SSH & Docker
  # ============================================================================
  deploy:
    name: Deploy to AWS EC2
    needs: test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - name: SSH and Deploy on EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            set -e
            echo "==> Navigating to project directory..."
            if [ -d "$HOME/office-jukebox" ]; then
              cd "$HOME/office-jukebox"
            elif [ -d "/var/www/office-jukebox" ]; then
              cd "/var/www/office-jukebox"
            else
              cd office-jukebox
            fi

            echo "==> Pulling latest changes from GitHub main branch..."
            git pull origin main

            echo "==> Rebuilding and restarting Docker containers..."
            docker compose up -d --build

            echo "==> Cleaning up unused Docker images..."
            docker image prune -f

            echo "==> Deployment completed successfully! 🚀"
